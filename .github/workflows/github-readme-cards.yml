# Estatísticas e top linguagens: secret STATS_PAT (PAT pessoal classic) é obrigatório.
# GITHUB_TOKEN do repositório não acessa os teus repositórios fechados noutros nomes.
# Criar PAT: https://github.com/settings/tokens — marcar: repo, read:user
# Atividade recente: variável do repositório ACTIVITY_GRAPH_URL (URL completa
# do /graph?...) se usar instância própria com TOKEN para incluir contribuições em repos
# fechados — ver https://github.com/Ashutosh00710/github-readme-activity-graph

name: Atualizar cards e atividade do perfil

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/**"
      - "README.md"

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Criar pasta profile
        run: mkdir -p profile

      - name: Obrigatório — secret STATS_PAT (repos privados)
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          if [ -z "$STATS_PAT" ]; then
            echo "::error::STATS_PAT em falta. Em Settings > Secrets, cria STATS_PAT com um PAT pessoal (classic: escopos repo e read:user). O GITHUB_TOKEN nao le repos privados da tua conta."
            exit 1
          fi

      - name: Gerar card de estatísticas
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=IgaoWolf&show_icons=true&theme=tokyonight&hide_border=true&locale=pt-br&count_private=true&include_all_commits=false&commits_year=2026&bg_color=1a1b27&custom_title=GitHub%20%C2%B7%202026%20%28p%C3%BAblico%20%2B%20privado%29
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Gerar card de linguagens
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          # count_private + PAT: linguagens de todos os repositórios acessíveis; a API não filtra por ano
          options: >-
            username=IgaoWolf&layout=compact&theme=tokyonight&hide_border=true&locale=pt-br&count_private=true&bg_color=1a1b27&custom_title=Linguagens%20%C2%B7%20p%C3%BAblico%20%2B%20privado&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Baixar card de streak (contribuições a partir de 2026)
        run: |
          curl -fsSL "https://streak-stats.demolab.com/?user=IgaoWolf&theme=tokyonight&hide_border=true&locale=pt_BR&background=1a1b27&starting_year=2026" -o profile/streak.svg

      - name: Baixar gráfico de atividade
        env:
          ACTIVITY_GRAPH_URL: ${{ vars.ACTIVITY_GRAPH_URL }}
        run: |
          set -e
          if [ -n "$ACTIVITY_GRAPH_URL" ]; then
            echo "Usando ACTIVITY_GRAPH_URL (ex.: Vercel próprio com TOKEN e escopo repo para repos privados)"
            curl -fsSL "$ACTIVITY_GRAPH_URL" -o profile/activity.svg
          else
            curl -fsSL "https://github-readme-activity-graph.vercel.app/graph?username=IgaoWolf&theme=tokyo-night&hide_border=true&area=true&bg_color=1a1b27&from=2026-01-01&to=2026-12-31&custom_title=Atividade%202026" -o profile/activity.svg
          fi

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg profile/activity.svg
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos SVGs"
            exit 0
          fi
          git commit -m "chore: atualizar cards e atividade do perfil [skip ci]"
          git push
