name: Generate Snake Animation

on:
  schedule:
    # Dois ciclos por dia (UTC); complementa a execução após os cards
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  # Regera a snake em seguida à atualização dos cards SVG no main
  workflow_run:
    workflows: ["Atualizar cards e atividade do perfil"]
    types: [completed]
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: IgaoWolf
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
